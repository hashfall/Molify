
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Mols</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <div class="Titulo">

            <h1>Calculadora de <span>Mols</span></h1>

            <div class="desricao">
                <p>
                    Converta entre mols, massa (peso) e volume
                    (litros) de forma rápida e simples.
                </p>
            </div>

            <div class="btn">

                <button type="button" onclick="window.location.href='mols.html'">
                    <a href="mols.html">Mols</a>
                    <span class="descricao-btn">
                        Converta mols em peso e litros
                    </span>
                </button>

                <button type="button" onclick="window.location.href='peso.html'">
                    <a href="peso.html">Peso</a>
                    <span class="descricao-btn">
                        Converta peso em mols e litros
                    </span>
                </button>

                <button type="button" onclick="window.location.href='litros.html'">
                    <a href="litros.html">Litros</a>
                    <span class="descricao-btn">
                        Converta litros em mols e peso
                    </span>
                </button>

            </div>

            <div class="rodap">
                <p>
                    Use a massa molar do seu composto para obter
                    resultados precisos.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
